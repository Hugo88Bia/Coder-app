<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codewise — Learn to Code, Properly</title>
<style>
  :root {
    --ink: #16130d;
    --paper: #f4efe4;
    --panel: #fcf9f1;
    --line: #ddd2bd;
    --amber: #b8620f;
    --amber-lt: #e39a45;
    --teal: #1f5f5b;
    --green: #3d6b38;
    --red: #a23421;
    --muted: #7d715c;
    --code-bg: #efe7d4;
    --code-bar: #e4d9c0;
    --code-text: #2a2418;
    --code-note: #94815f;
    --mono: 'SF Mono','Fira Code','Consolas',monospace;
    --serif: Georgia,'Times New Roman',serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--serif); background: var(--paper); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { padding: 12px 20px; border-bottom: 2px solid var(--ink); background: var(--panel); display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 20px; letter-spacing: -0.5px; }
  .brand .tag { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--amber); }
  .track { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .track b { color: var(--amber); }
  .stats { display: flex; align-items: center; gap: 16px; }
  .stat { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--ink); }
  .stat .stat-ico { font-size: 16px; }
  .stat .stat-lbl { font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 1px; }
  .stat.goal { position: relative; }
  .stat.goal .goal-txt { position: absolute; left: 0; top: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--amber); }
  #goalRing { transition: stroke-dashoffset 0.6s ease; }
  .xp-pop { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--green); color: #fff; font-family: var(--mono); font-weight: 700; font-size: 15px; padding: 10px 22px; border-radius: 30px; opacity: 0; pointer-events: none; z-index: 100; transition: all 0.4s ease; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
  .xp-pop.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .layout { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside { width: 230px; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; flex-shrink: 0; }
  .sec-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); padding: 16px 16px 6px; }
  .l-item { padding: 11px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .l-item.locked { opacity: 0.4; cursor: not-allowed; }
  .l-item:not(.locked):hover { background: #efe7d6; }
  .l-item.active { background: var(--ink); color: var(--paper); }
  .l-item .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 700; }
  .l-item.active .dot { border-color: var(--amber-lt); color: var(--amber-lt); }
  .l-item.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .l-item .nm { font-size: 14px; }
  .l-item .lock { margin-left: auto; font-size: 11px; }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .content { flex: 1; overflow-y: auto; padding: 26px 34px; max-width: 760px; }
  .step-pill { display: inline-block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #fff; background: var(--teal); padding: 3px 10px; border-radius: 2px; margin-bottom: 14px; }
  h2 { font-size: 26px; letter-spacing: -0.5px; margin-bottom: 4px; }
  .sub { font-family: var(--mono); font-size: 12px; color: var(--amber); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
  .block { margin-bottom: 20px; }
  .block h3 { font-size: 15px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--teal); margin-bottom: 10px; }
  p { font-size: 16px; line-height: 1.7; margin-bottom: 12px; color: #2f281d; }
  .analogy { border-left: 3px solid var(--amber); padding: 12px 16px; background: #f7efdd; font-size: 15px; line-height: 1.6; margin-bottom: 16px; border-radius: 0 4px 4px 0; }
  .analogy b { color: var(--amber); }
  code { font-family: var(--mono); font-size: 14px; background: #e9e0cd; padding: 1px 6px; border-radius: 3px; }

  .example { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
  .example .ln { display: flex; font-family: var(--mono); font-size: 13.5px; line-height: 1.7; }
  .example .ln .code { color: var(--code-text); padding: 0 14px; white-space: pre; }
  .example .ln .note { color: var(--code-note); font-style: italic; padding-right: 14px; margin-left: auto; font-size: 12px; }
  .example .body { padding: 14px 0; }

  .task-box { border: 2px solid var(--ink); border-radius: 5px; padding: 18px; margin-bottom: 16px; background: var(--panel); }
  .task-box .th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--amber); margin-bottom: 8px; }
  .task-box p { font-size: 15px; margin-bottom: 0; }

  .editor { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
  .editor .bar { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: var(--code-bar); }
  .editor .bar span { font-family: var(--mono); font-size: 10px; color: var(--code-note); text-transform: uppercase; letter-spacing: 1px; }
  textarea { width: 100%; min-height: 130px; font-family: var(--mono); font-size: 14px; line-height: 1.6; padding: 14px; border: none; background: var(--code-bg); color: var(--code-text); outline: none; resize: vertical; tab-size: 2; }

  .actions { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  button { font-family: var(--mono); font-size: 13px; font-weight: 700; border: none; padding: 9px 20px; cursor: pointer; border-radius: 3px; letter-spacing: 0.5px; }
  .run { background: var(--teal); color: #fff; }
  .run:hover { background: #164340; }
  .check { background: var(--amber); color: #fff; }
  .check:hover { background: #8f4b0a; }
  .hint { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hint:hover { background: #efe7d6; }
  .next { background: var(--green); color: #fff; margin-left: auto; }
  .next:hover { background: #2e5029; }
  .next:disabled { background: #c3bba8; cursor: not-allowed; }

  .out { font-family: var(--mono); font-size: 13px; line-height: 1.6; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); color: var(--code-text); border-radius: 5px; white-space: pre-wrap; min-height: 20px; margin-bottom: 12px; }
  .out .err { color: var(--red); font-weight: 700; }
  .out .dim { color: var(--muted); }
  .preview-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--teal); margin-bottom: 6px; }
  .preview { width: 100%; min-height: 160px; background: #fff; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 12px; }

  .feedback { padding: 12px 16px; border-radius: 5px; font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
  .feedback.good { background: #e4efdd; border-left: 3px solid var(--green); color: #274d22; }
  .feedback.bad { background: #f6e2dd; border-left: 3px solid var(--red); color: #7a281a; }
  .feedback.tip { background: #f7efdd; border-left: 3px solid var(--amber); color: #6d3f0a; }

  .celebrate { text-align: center; padding: 40px; }
  .celebrate h2 { font-size: 30px; }

  @media (max-width: 720px) {
    aside { display: none; }
    .content { padding: 20px; }
    .example .ln .note { display: none; }
    header { padding: 10px 14px; }
    .brand .tag { display: none; }
    .stats { gap: 11px; }
    .stat { font-size: 14px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
</head>
<body>
<header>
  <div class="brand"><h1>Codewise</h1><span class="tag">Learn to code, properly</span></div>
  <div class="stats">
    <div class="stat" title="Day streak"><span class="stat-ico">🔥</span><b id="streakNum">0</b></div>
    <div class="stat" title="Total XP"><span class="stat-ico">⭐</span><b id="xpNum">0</b><span class="stat-lbl">XP</span></div>
    <div class="stat goal" title="Today's goal">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="14" fill="none" stroke="var(--line)" stroke-width="4"/>
        <circle id="goalRing" cx="17" cy="17" r="14" fill="none" stroke="var(--amber)" stroke-width="4"
          stroke-dasharray="88" stroke-dashoffset="88" stroke-linecap="round" transform="rotate(-90 17 17)"/>
      </svg>
      <span id="goalTxt" class="goal-txt">0/3</span>
    </div>
  </div>
</header>
<div id="xpPop" class="xp-pop"></div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main><div class="content" id="content"></div></main>
</div>

<script>
// ---- COURSE DATA ----
// Each lesson: concept (analogy + explanation), a worked example (lines with notes),
// a task, starter code, a checker fn (returns {pass, msg}), and progressive hints.
const course = [
  {
    id: "print",
    name: "Your first output",
    sub: "Making the computer speak",
    concept: {
      analogy: `Think of <b>console.log</b> as the computer's voice. Whatever you hand it, it says out loud. Nothing more mysterious than that.`,
      body: `<p>Before a program can do anything useful, it needs a way to <em>show</em> you what it's doing. In JavaScript that's <code>console.log()</code>.</p>
             <p>Whatever you want to print goes <strong>inside the brackets</strong>. And if it's text, it also goes <strong>inside quotes</strong>. So text you print sits in two layers: the brackets, and the quotes inside them — like this: <code>console.log("your words here")</code>.</p>
             <p>Those quotes matter more than they look. They tell the computer "this is words, not a command." Text in quotes is called a <strong>string</strong>.</p>
             <p><strong>The one trap:</strong> your words must go <em>between</em> the quotes, not after them. Writing <code>console.log("")i am here</code> won't work — the computer prints the empty quotes, then trips over the loose words outside and stops with an error. Everything you want to say belongs <em>inside</em> the <code>" "</code>.</p>`
    },
    example: [
      { code: `console.log("Hello!");`, note: `words go inside the " "` },
      { code: `console.log("I am learning to code");`, note: `all inside the quotes` }
    ],
    task: `Print a message that says <code>I am Hugo</code> (or your own name). Type your words <strong>between the empty quotes</strong> that are already there — don't add anything after them. Then press Check.`,
    starter: `console.log("");`,
    hints: [
      `Click between the two quote marks and type there: console.log("I am Hugo");`,
      `Your words go INSIDE the "  ". Nothing should come after the );`,
      `The finished line is exactly: console.log("I am Hugo");`
    ],
    check: (code, out) => {
      if (!/console\.log/.test(code)) return { pass:false, msg:"I don't see a console.log yet. That's the command that prints." };
      if (out.trim() === "") return { pass:false, msg:"It ran, but printed nothing. Type your words between the two quote marks." };
      return { pass:true, msg:`It spoke! You printed: "${out.trim()}". You've just written and run real code.` };
    }
  },
  {
    id: "variables",
    name: "Storing information",
    sub: "Variables",
    concept: {
      analogy: `A <b>variable</b> is a labelled box. You put a value in it, write a name on the side, and from then on you just call it by name.`,
      body: `<p>Programs need to remember things — a name, a price, a score. You store a value in a <strong>variable</strong>.</p>
             <p>You create one with the word <code>let</code>, then a name you choose, an <code>=</code> sign, and the value. Example: <code>let age = 38;</code> means "make a box called age, put 38 in it."</p>
             <p>After that, writing <code>age</code> anywhere gives you back 38.</p>`
    },
    example: [
      { code: `let name = "Marina";`, note: `box "name" holds Marina` },
      { code: `console.log(name);`, note: `prints:  Marina` },
      { code: `console.log("Hi " + name);`, note: `joins text + box → Hi Marina` }
    ],
    task: `Make a variable called <code>city</code>, store the text <code>Jersey</code> in it, then print it. Press Check.`,
    starter: `let city = "";\nconsole.log(city);`,
    hints: [
      `Fill in the quotes: let city = "Jersey";`,
      `Then make sure you print it: console.log(city);`,
      `Full answer: let city = "Jersey"; then console.log(city);`
    ],
    check: (code, out) => {
      if (!/let\s+city/.test(code)) return { pass:false, msg:"Make a variable named exactly 'city' using: let city = ..." };
      if (!/console\.log/.test(code)) return { pass:false, msg:"You've made the box — now print it with console.log(city)." };
      if (!/jersey/i.test(out)) return { pass:false, msg:"Nearly — the box should hold 'Jersey' and get printed. Check your quotes." };
      return { pass:true, msg:"Stored and printed. You now know how to make a program remember things." };
    }
  },
  {
    id: "maths",
    name: "Working with numbers",
    sub: "Maths & operators",
    concept: {
      analogy: `The computer is a very fast, very literal calculator. Give it numbers and the signs <b>+ − * /</b> and it works out the answer instantly.`,
      body: `<p>Numbers don't need quotes — quotes are only for text. You can do maths directly: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide.</p>
             <p>And you can store the result in a variable, then use it. This is how every price, total, and score in every app gets worked out.</p>`
    },
    example: [
      { code: `let price = 40;`, note: `a number — no quotes` },
      { code: `let tax = price * 0.2;`, note: `40 × 0.2 = 8` },
      { code: `console.log(price + tax);`, note: `prints:  48` }
    ],
    task: `You have <code>let a = 15;</code> and <code>let b = 6;</code>. Print their total (it should be 21). Press Check.`,
    starter: `let a = 15;\nlet b = 6;\n// print a + b below\n`,
    hints: [
      `Add them inside a log: console.log(a + b);`,
      `Don't put a and b in quotes — you want the maths, not the text.`,
      `Answer: console.log(a + b);`
    ],
    check: (code, out) => {
      if (!/console\.log/.test(code)) return { pass:false, msg:"Print the result with console.log(...)." };
      if (/["']a["']|["']b["']/.test(code)) return { pass:false, msg:"Take the quotes off a and b — quotes make them text, so you'd get 'a + b' not 21." };
      if (out.trim() !== "21") return { pass:false, msg:`Expected 21 but got "${out.trim()}". Make sure you're adding a + b.` };
      return { pass:true, msg:"21 — exactly right. You just made the computer do the arithmetic." };
    }
  },
  {
    id: "if",
    name: "Making decisions",
    sub: "if / else",
    concept: {
      analogy: `<b>if / else</b> is a fork in the road. "IF this is true, go left; otherwise, go right." The computer checks the condition and picks a path.`,
      body: `<p>Real programs react to things. You write <code>if (condition) { ... }</code> — if the condition is true, the code in the braces runs. Add <code>else { ... }</code> for what happens otherwise.</p>
             <p>Conditions use: <code>&gt;</code> greater than, <code>&lt;</code> less than, <code>&gt;=</code> at least, <code>===</code> exactly equal.</p>`
    },
    example: [
      { code: `let score = 72;`, note: `` },
      { code: `if (score >= 50) {`, note: `is 72 ≥ 50? yes` },
      { code: `  console.log("Pass");`, note: `← this runs` },
      { code: `} else {`, note: `` },
      { code: `  console.log("Fail");`, note: `skipped` },
      { code: `}`, note: `` }
    ],
    task: `A variable <code>temp = 30;</code> is set. Print <code>Hot</code> if temp is above 25, otherwise print <code>Cool</code>. Press Check.`,
    starter: `let temp = 30;\n\nif (temp > 25) {\n  \n} else {\n  \n}`,
    hints: [
      `Inside the first braces: console.log("Hot");`,
      `Inside the else braces: console.log("Cool");`,
      `Since temp is 30 (above 25), running it should print Hot.`
    ],
    check: (code, out) => {
      if (!/if\s*\(/.test(code)) return { pass:false, msg:"You'll need an if(...) statement here." };
      if (!/console\.log/.test(code)) return { pass:false, msg:"Put a console.log inside each branch." };
      if (out.trim() !== "Hot") return { pass:false, msg:`temp is 30, so the 'above 25' path should run and print Hot. You got "${out.trim()}".` };
      return { pass:true, msg:"Hot — correct. Your program made a decision on its own. This is the heart of every app." };
    }
  },
  {
    id: "loops",
    name: "Repeating work",
    sub: "Loops",
    concept: {
      analogy: `A <b>loop</b> is like telling someone "do this 10 times" instead of writing the instruction out 10 times. The computer handles the repetition.`,
      body: `<p>When you need to repeat something, you use a loop. The <code>for</code> loop has three parts: where to start, how long to keep going, and how to step each time.</p>
             <p><code>for (let i = 1; i &lt;= 5; i++)</code> means: start at 1, keep going while i is 5 or less, add 1 each round. <code>i++</code> is shorthand for "add one to i."</p>`
    },
    example: [
      { code: `for (let i = 1; i <= 3; i++) {`, note: `start 1, stop after 3` },
      { code: `  console.log(i);`, note: `prints 1, then 2, then 3` },
      { code: `}`, note: `` }
    ],
    task: `Write a loop that counts and prints from <code>1</code> to <code>5</code>. Press Check.`,
    starter: `for (let i = 1; i <= 5; i++) {\n  \n}`,
    hints: [
      `Inside the braces, print the counter: console.log(i);`,
      `The loop is already set to go 1 → 5. You just need to print i each time.`,
      `Answer: put console.log(i); between the braces.`
    ],
    check: (code, out) => {
      if (!/for\s*\(/.test(code)) return { pass:false, msg:"Use a for loop for this one." };
      const nums = out.trim().split(/\s+/);
      if (nums.join(",") !== "1,2,3,4,5") return { pass:false, msg:`It should print 1 2 3 4 5 (each on its own line). You got: ${out.trim() || "nothing"}.` };
      return { pass:true, msg:"1 through 5 — perfect. You just made the computer repeat work for you. That's a superpower." };
    }
  },
  {
    id: "functions",
    name: "Reusable actions",
    sub: "Functions",
    concept: {
      analogy: `A <b>function</b> is a recipe. You write the steps once, give the recipe a name, and then just say the name whenever you want it done — you don't rewrite the steps each time.`,
      body: `<p>Functions let you package code and reuse it. You define one with <code>function name(input) { ... }</code>, then <em>call</em> it by writing <code>name(value)</code>.</p>
             <p>The <code>input</code> in the brackets (called a parameter) lets you feed it different values each time — so one function handles many cases.</p>`
    },
    example: [
      { code: `function greet(name) {`, note: `recipe named greet` },
      { code: `  console.log("Hi " + name);`, note: `the steps` },
      { code: `}`, note: `` },
      { code: `greet("Sam");`, note: `run it → Hi Sam` },
      { code: `greet("Bea");`, note: `run again → Hi Bea` }
    ],
    task: `Write a function called <code>double</code> that takes a number and prints it multiplied by 2. Then call it with <code>5</code> (should print 10). Press Check.`,
    starter: `function double(n) {\n  \n}\n\ndouble(5);`,
    hints: [
      `Inside the function: console.log(n * 2);`,
      `Make sure you also call it at the bottom: double(5);`,
      `Full: the body is console.log(n * 2); and you call double(5);`
    ],
    check: (code, out) => {
      if (!/function\s+double/.test(code)) return { pass:false, msg:"Define a function named exactly 'double'." };
      if (!/double\s*\(/.test(code.replace(/function\s+double/,''))) return { pass:false, msg:"You defined it — now call it with double(5);" };
      if (out.trim() !== "10") return { pass:false, msg:`Calling double(5) should print 10. You got "${out.trim()}". Multiply n by 2 inside.` };
      return { pass:true, msg:"10 — spot on. You've written a reusable function. This is how real programs stay organised." };
    }
  },
  {
    id: "arrays",
    name: "Lists of things",
    sub: "Arrays",
    concept: {
      analogy: `An <b>array</b> is a shopping list. One name, many items, kept in order. Instead of a separate box for each thing, you have one box holding a numbered list.`,
      body: `<p>So far each variable held one value. But real programs deal with <em>many</em> things — a list of customers, prices, jobs. That's an <strong>array</strong>: values inside square brackets <code>[ ]</code>, separated by commas.</p>
             <p>Each item has a position number called an <strong>index</strong>, and here's the catch every coder trips on at first: <strong>counting starts at 0</strong>. The first item is index 0, the second is 1, and so on. You reach an item with <code>list[0]</code>.</p>`
    },
    example: [
      { code: `let jobs = ["carpet", "sofa", "mattress"];`, note: `a list of 3` },
      { code: `console.log(jobs[0]);`, note: `prints:  carpet  (first!)` },
      { code: `console.log(jobs[2]);`, note: `prints:  mattress` },
      { code: `console.log(jobs.length);`, note: `prints:  3  (how many)` }
    ],
    task: `Make an array called <code>fruits</code> holding <code>apple</code>, <code>banana</code>, and <code>cherry</code>. Then print just the second item (banana). Press Check.`,
    starter: `let fruits = [];\n\n// print the second item\n`,
    hints: [
      `Fill the array: let fruits = ["apple", "banana", "cherry"];`,
      `The second item is index 1 (because counting starts at 0).`,
      `Print it: console.log(fruits[1]);`
    ],
    check: (code, out) => {
      if (!/let\s+fruits\s*=\s*\[/.test(code)) return { pass:false, msg:"Make an array named 'fruits' using square brackets [ ]." };
      if (!/console\.log/.test(code)) return { pass:false, msg:"Print an item with console.log(fruits[...])." };
      if (out.trim().toLowerCase() !== "banana") return { pass:false, msg:`The second item is banana — but remember it's index 1, not 2. You got "${out.trim()}".` };
      return { pass:true, msg:"banana — and you got the index right. Starting from 0 confuses everyone at first; you've already got it." };
    }
  },
  {
    id: "arrayloop",
    name: "Going through a list",

             <p>That's the big reveal: an API is just a server that answers with data instead of a web page. And that data is the array-of-objects you already know cold. Your Codewise price calculator's job list <em>is</em> the shape a real API sends back.</p>`
    },
    example: [
      { code: `function api(route) {`, note: `an API = data server` },
      { code: `  if (route === "/jobs") {`, note: `` },
      { code: `    return [`, note: `returns an array of objects` },
      { code: `      { name: "Carpet", price: 40 },`, note: `= JSON` },
      { code: `      { name: "Sofa", price: 35 }`, note: `` },
      { code: `    ];`, note: `` },
      { code: `  }`, note: `` },
      { code: `}`, note: `` },
      { code: `let data = api("/jobs");`, note: `client receives the data` },
      { code: `console.log(data[0].name);`, note: `→ Carpet` }
    ],
    task: `The API returns a list of jobs when asked for <code>"/jobs"</code>. It's already written. Your task: after calling it, loop through <code>data</code> and print each job's name and price as <code>NAME: £PRICE</code>. Press Check.`,
    starter: `function api(route) {\n  if (route === "/jobs") {\n    return [\n      { name: "Carpet", price: 40 },\n      { name: "Sofa", price: 35 },\n      { name: "Mattress", price: 40 }\n    ];\n  }\n}\n\nlet data = api("/jobs");\n\n// loop through data and print each as NAME: £PRICE\n`,
    hints: [
      `Loop the returned data: for (let job of data) { ... }`,
      "Inside, print with a template string: console.log(`${job.name}: £${job.price}`);",
      "So: for (let job of data) { console.log(`${job.name}: £${job.price}`); }"
    ],
    check: (code, out) => {
      if (!/for\s*\(/.test(code)) return { pass:false, msg:"Loop through the data the API returned." };
      const o = out.trim();
      if (!/Carpet: £40/.test(o) || !/Sofa: £35/.test(o) || !/Mattress: £40/.test(o))
        return { pass:false, msg:`Each line should read like "Carpet: £40". You got: ${o || "nothing"}.` };
      return { pass:true, msg:"You just consumed an API — asked a server for data and used what came back. This is what almost every app on your phone does all day. And the data was array-of-objects, exactly what you learned on day one. It all connects." };
    }
  },
  {
    id: "srv-full",
    name: "The whole picture",
    sub: "How it all fits together",
    concept: {
      analogy: `Step back and see the whole machine. A real app has three parts you now understand: the <b>front end</b> (HTML/CSS/JavaScript — what you see and click), the <b>server</b> (decides what to do with requests), and the <b>data</b> (the records, stored and sent as objects). You've touched all three.`,
      body: `<p>Here's the full journey of one tap in an app: you tap a button (front end, JavaScript) → it sends a request to a route (server) → the server fetches records (data, objects) → sends them back as JSON → your front end loops through them and shows them on screen (HTML). Every single step uses something in this course.</p>
             <p>This final task ties it together: a tiny end-to-end flow. A request goes to a server, the server returns data, and you present it — front end, back end, and data in one small program. Nothing new to learn. Just assembly.</p>`
    },
    example: [
      { code: `// the server side:`, note: `` },
      { code: `function api(route) {`, note: `back end` },
      { code: `  if (route === "/services")`, note: `` },
      { code: `    return ["Carpets", "Sofas"];`, note: `data` },
      { code: `}`, note: `` },
      { code: `// the front-end side:`, note: `` },
      { code: `let items = api("/services");`, note: `request the data` },
      { code: `for (let s of items) {`, note: `` },
      { code: `  console.log("• " + s);`, note: `present it` },
      { code: `}`, note: `` }
    ],
    task: `The <code>api</code> returns three services for route <code>"/services"</code> (already written). Request the data into a variable, then loop through it printing each service with a <code>• </code> bullet in front (e.g. <code>• Carpets</code>). Press Check.`,
    starter: `function api(route) {\n  if (route === "/services") {\n    return ["Carpets", "Sofas", "Mattresses"];\n  }\n}\n\n// 1. request the data\n\n\n// 2. loop through it, printing "• " + each service\n`,
    hints: [
      `Request it: let items = api("/services");`,
      `Then loop: for (let s of items) { console.log("• " + s); }`,
      `Two steps: get the data into a variable, then loop and print each with a bullet.`
    ],
    check: (code, out) => {
      if (!/api\s*\(\s*["']\/services["']\s*\)/.test(code)) return { pass:false, msg:'Request the data by calling api("/services") and storing it.' };
      if (!/for\s*\(/.test(code)) return { pass:false, msg:"Loop through the services you got back." };
      const o = out.trim();
      if (!/•\s*Carpets/.test(o) || !/•\s*Sofas/.test(o) || !/•\s*Mattresses/.test(o))
        return { pass:false, msg:`Each line should look like "• Carpets". You got: ${o || "nothing"}.` };
      return { pass:true, msg:"You just ran a complete round trip: front end requests → server responds with data → front end displays it. That's the shape of every app in existence. You began never having written a line. You now understand two languages and how the whole web fits together. That's not 'learning to code' anymore — that's knowing how to code." };
    }
  }
];

// Join all sections into one course
course.push(...webCourse);
course.push(...pyCourse);
course.push(...serverCourse);

// ---- STATE (in-memory; resets on reload) ----
let progress = 0;      // highest unlocked lesson index
let current = 0;
let hintLevel = 0;
let lastOutput = "";

// ---- GAMIFICATION STATE ----
let xp = 0;
let streak = 1;                 // starts at day 1 the moment you begin
let lessonsToday = 0;
const DAILY_GOAL = 3;
const XP_PER_LESSON = 20;
const earnedXpFor = new Set();  // lessons already awarded, so XP isn't double-counted

function awardXp(lessonIndex) {
  if (earnedXpFor.has(lessonIndex)) return;  // no double XP for re-passing
  earnedXpFor.add(lessonIndex);
  xp += XP_PER_LESSON;
  lessonsToday = Math.min(lessonsToday + 1, DAILY_GOAL);
  popXp(`+${XP_PER_LESSON} XP  ⭐`);
  updateStats();
  if (lessonsToday === DAILY_GOAL) {
    setTimeout(() => popXp(`Daily goal hit! 🔥 ${streak}-day streak`), 900);
  }
}

function updateStats() {
  const s = document.getElementById('streakNum');
  const x = document.getElementById('xpNum');
  const gt = document.getElementById('goalTxt');
  const ring = document.getElementById('goalRing');
  if (s) s.textContent = streak;
  if (x) x.textContent = xp;
  if (gt) gt.textContent = `${lessonsToday}/${DAILY_GOAL}`;
  if (ring) {
    const circ = 88; // 2πr for r=14
    ring.style.strokeDashoffset = circ - (circ * lessonsToday / DAILY_GOAL);
  }
}

function popXp(text) {
  const p = document.getElementById('xpPop');
  if (!p) return;
  p.textContent = text;
  p.classList.add('show');
  clearTimeout(p._t);
  p._t = setTimeout(() => p.classList.remove('show'), 1800);
}
let passedCurrent = false;

// ---- RENDER SIDEBAR ----
function renderSidebar() {
  const el = document.getElementById('sidebar');
  el.innerHTML = '<div class="sec-label">Part 1 · JavaScript</div>';
  let webHeaderShown = false, pyHeaderShown = false, srvHeaderShown = false;
  course.forEach((l, i) => {
    if (l.web && !webHeaderShown) {
      const h = document.createElement('div');
      h.className = 'sec-label';
      h.textContent = 'Part 2 · Web Pages';
      el.appendChild(h);
      webHeaderShown = true;
    }
    if (l.py && !pyHeaderShown) {
      const h = document.createElement('div');
      h.className = 'sec-label';
      h.textContent = 'Part 3 · Python';
      el.appendChild(h);
      pyHeaderShown = true;
    }
    if (l.srv === undefined && l.id && l.id.startsWith('srv-') && !srvHeaderShown) {
      const h = document.createElement('div');
      h.className = 'sec-label';
      h.textContent = 'Part 4 · Servers';
      el.appendChild(h);
      srvHeaderShown = true;
    }
    const locked = i > progress;
    const d = document.createElement('div');
    d.className = 'l-item' + (locked ? ' locked' : '') + (i === current ? ' active' : '') + (completed.has(i) ? ' done' : '');
    if (!locked) d.onclick = () => loadLesson(i);
    d.innerHTML = `<span class="dot">${completed.has(i) ? '✓' : (i+1)}</span>
      <span class="nm">${l.name}</span>${locked ? '<span class="lock">🔒</span>' : ''}`;
    el.appendChild(d);
  });
  const tn = document.getElementById('trackNow');
  const tt = document.getElementById('trackTot');
  if (tn) tn.textContent = current + 1;
  if (tt) tt.textContent = course.length;
}

const completed = new Set();

// ---- RENDER LESSON ----
function loadLesson(i) {
  current = i;
  hintLevel = 0;
  lastOutput = "";
  passedCurrent = completed.has(i);
  const l = course[i];

  const exampleHTML = l.example.map(line =>
    `<div class="ln"><span class="code">${esc(line.code)}</span>${line.note ? `<span class="note">${line.note}</span>` : ''}</div>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <span class="step-pill">Step ${i+1} · ${l.sub}</span>
    <h2>${l.name}</h2>

    <div class="block">
      <h3>1 · The idea</h3>
      <div class="analogy">${l.concept.analogy}</div>
      ${l.concept.body}
    </div>

    <div class="block">
      <h3>2 · Watch it work</h3>
      <div class="example"><div class="body">${exampleHTML}</div></div>
    </div>

    <div class="block">
      <h3>3 · Now you</h3>
      <div class="task-box"><div class="th">Your task</div><p>${l.task}</p></div>
      <div class="editor">
        <div class="bar"><span>${l.web ? 'editor.html' : (l.py ? 'editor.py' : 'editor.js')}</span></div>
        <textarea id="editor" spellcheck="false">${esc(l.starter)}</textarea>
      </div>
      <div class="actions">
        <button class="run" onclick="runCode()">▶ Run</button>
        <button class="check" onclick="checkCode()">✓ Check my answer</button>
        <button class="hint" onclick="showHint()">Need a hint?</button>
      </div>
      ${l.web
        ? `<div class="preview-label">Live preview</div><iframe id="preview" class="preview" sandbox="allow-same-origin"></iframe>`
        : `<div class="out" id="out"><span class="dim">Run your code to see the output.</span></div>`}
      <div id="feedback"></div>
      <div class="actions">
        <button class="next" id="nextBtn" onclick="nextLesson()" ${passedCurrent ? '' : 'disabled'}>Next lesson →</button>
      </div>
    </div>
  `;
  attachTab();
  renderSidebar();
  document.getElementById('content').scrollTop = 0;
  if (l.web) runCode();
}

// ---- RUN CODE (sandboxed) ----
function execute() {
  const code = document.getElementById('editor').value;
  const logs = [];
  const fake = { log: (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ')) };
  try {
    new Function('console', code)(fake);
    return { ok:true, out: logs.join('\n') };
  } catch (e) {
    return { ok:false, out: '', err: String(e.message) };
  }
}

// ---- PYTHON (real Python via Pyodide, loaded on first use) ----
let pyodideReady = null;
function loadPyodideOnce() {
  if (!pyodideReady) {
    pyodideReady = (async () => {
      const py = await loadPyodide();
      return py;
    })();
  }
  return pyodideReady;
}

async function executePython() {
  const code = document.getElementById('editor').value;
  try {
    const py = await loadPyodideOnce();
    // Capture stdout by redirecting print
    py.runPython(`
import sys, io
_buf = io.StringIO()
sys.stdout = _buf
`);
    py.runPython(code);
    let out = py.runPython(`_buf.getvalue()`);
    py.runPython(`sys.stdout = sys.__stdout__`);
    return { ok: true, out: String(out) };
  } catch (e) {
    return { ok: false, out: '', err: String(e.message || e) };
  }
}

function friendlyPyError(err) {
  const e = String(err);
  if (/IndentationError|expected an indented block/.test(e))
    return `<b>Indentation problem.</b> In Python, the lines inside an <code>if</code>, loop, or function must be indented (pushed in with spaces). Make sure the lines below a <code>:</code> are indented, and all indented the same amount.`;
  if (/SyntaxError/.test(e) && /:/.test(e))
    return `<b>A small syntax slip.</b> Check for a missing colon <code>:</code> at the end of an <code>if</code>, <code>for</code>, or <code>def</code> line — Python needs it before the indented block.`;
  if (/NameError/.test(e)) {
    const m = e.match(/name '(\w+)' is not defined/);
    return `<b>Python doesn't recognise "${m ? m[1] : 'that word'}".</b> If it's text, it needs quotes. If it's a variable, check the spelling matches exactly where you created it.`;
  }
  return `<b>Read the message carefully</b> — Python tells you the line and what confused it. That's a clue, not a telling-off.`;
}

async function runCode() {
  const lesson = course[current];
  if (lesson.web) {
    const code = document.getElementById('editor').value;
    const frame = document.getElementById('preview');
    if (frame) frame.srcdoc = `<style>body{font-family:Georgia,serif;padding:14px;color:#16130d;}</style>` + code;
    lastOutput = code;
    return;
  }
  const out = document.getElementById('out');
  const fb = document.getElementById('feedback');

  if (lesson.py) {
    if (out) out.innerHTML = '<span class="dim">Starting Python… (first run loads it, ~10s, then it\'s instant)</span>';
    const r = await executePython();
    if (!r.ok) {
      out.innerHTML = `<span class="err">✗ ${esc(r.err)}</span>`;
      if (fb) { fb.className = 'feedback tip'; fb.innerHTML = friendlyPyError(r.err); }
      lastOutput = "";
      return;
    }
    lastOutput = r.out;
    out.innerHTML = r.out.trim() === "" ? '<span class="dim">Ran with no output yet.</span>' : esc(r.out);
    return;
  }

  const r = execute();
  if (!r.ok) {
    out.innerHTML = `<span class="err">✗ ${esc(r.err)}</span>`;
    fb.className = 'feedback tip';
    fb.innerHTML = friendlyError(r.err);
    lastOutput = "";
    return;
  }
  lastOutput = r.out;
  out.innerHTML = r.out.trim() === "" ? '<span class="dim">Ran with no output yet.</span>' : esc(r.out);
}

function friendlyError(err) {
  const e = String(err);
  if (/Unexpected identifier/.test(e))
    return `<b>Loose words outside the quotes.</b> The computer found some text that isn't inside quotes and isn't a command, so it didn't know what to do with it. Check that everything you want to print is <em>between</em> the <code>" "</code>, and that nothing extra is sitting after the <code>);</code>`;
  if (/Unexpected end of input|missing \) after|Unexpected token/.test(e))
    return `<b>A bracket or quote is missing.</b> Usually this means an opening <code>(</code>, <code>{</code> or <code>"</code> doesn't have its matching partner. Count them — each opener needs a closer.`;
  if (/is not defined/.test(e)) {
    const m = e.match(/(\w+) is not defined/);
    return `<b>The computer doesn't recognise "${m ? m[1] : 'that word'}".</b> If it's meant to be text, it needs quotes around it. If it's a variable, check the spelling matches exactly where you created it.`;
  }
  if (/Unexpected string/.test(e))
    return `<b>Two pieces of text aren't joined.</b> If you're sticking text together, you need a <code>+</code> between the parts.`;
  return `<b>Read the message below carefully</b> — it points at where the computer got confused. That's a clue about what to fix, not a telling-off.`;
}

async function checkCode() {
  const code = document.getElementById('editor').value;
  const lesson = course[current];
  const fb = document.getElementById('feedback');

  const markPass = (msg) => {
    fb.className = 'feedback good';
    fb.innerHTML = `✓ ${msg}`;
    passedCurrent = true;
    const firstTime = !completed.has(current);
    completed.add(current);
    if (current === progress) progress = Math.min(progress + 1, course.length - 1);
    document.getElementById('nextBtn').disabled = false;
    renderSidebar();
    if (firstTime) awardXp(current);
  };
  const markFail = (msg) => {
    fb.className = 'feedback bad';
    fb.innerHTML = `Not quite yet — ${msg} Try again, and use a hint if you're stuck.`;
  };

  // Web lessons: check the HTML/CSS directly and refresh the preview.
  if (lesson.web) {
    runCode();
    const result = lesson.check(code);
    result.pass ? markPass(result.msg) : markFail(result.msg);
    return;
  }

  // Python lessons: run real Python and check the output.
  if (lesson.py) {
    const out = document.getElementById('out');
    if (out) out.innerHTML = '<span class="dim">Running Python…</span>';
    const r = await executePython();
    if (!r.ok) {
      out.innerHTML = `<span class="err">✗ ${esc(r.err)}</span>`;
      fb.className = 'feedback bad';
      fb.innerHTML = `Your code has an error, so let's fix that first. ${friendlyPyError(r.err)} <br><br><span class="dim">(The exact message is: ${esc(r.err)} — errors are clues, not failures.)</span>`;
      return;
    }
    out.innerHTML = r.out.trim() === "" ? '<span class="dim">Ran with no output.</span>' : esc(r.out);
    const result = lesson.check(code, r.out);
    result.pass ? markPass(result.msg) : markFail(result.msg);
    return;
  }

  // JS lessons: run the code and check its output.
  const r = execute();
  const out = document.getElementById('out');
  if (!r.ok) {
    out.innerHTML = `<span class="err">✗ ${esc(r.err)}</span>`;
    fb.className = 'feedback bad';
    fb.innerHTML = `Your code has an error, so let's fix that first. ${friendlyError(r.err)} <br><br><span class="dim">(The exact message is: ${esc(r.err)} — errors are clues, not failures.)</span>`;
    return;
  }
  out.innerHTML = r.out.trim() === "" ? '<span class="dim">Ran with no output.</span>' : esc(r.out);

  const result = lesson.check(code, r.out);
  result.pass ? markPass(result.msg) : markFail(result.msg);
}

function showHint() {
  const l = course[current];
  const fb = document.getElementById('feedback');
  const h = l.hints[Math.min(hintLevel, l.hints.length - 1)];
  fb.className = 'feedback tip';
  fb.innerHTML = `💡 Hint ${Math.min(hintLevel+1, l.hints.length)}: ${h}`;
  hintLevel++;
}

function nextLesson() {
  if (!passedCurrent) return;
  if (current + 1 < course.length) loadLesson(current + 1);
  else showFinish();
}

function showFinish() {
  document.getElementById('content').innerHTML = `
    <div class="celebrate">
      <span class="step-pill">Course complete</span>
      <h2>You can code.</h2>
      <p>You started never having written a line. You now understand output, variables, maths, decisions, loops, functions, arrays, and objects — written yourself, in <strong>two languages</strong>: JavaScript and Python. You've built real web pages you can see, and you understand how servers, routes, and APIs tie the whole web together.</p>
      <p>That's the complete shape of software: a front end you can see, a back end that decides things, and data flowing between them. Everything else — bigger apps, games, AI tools — is a combination of exactly these ideas. The rest is just practice.</p>
      <p><strong>Where to go next:</strong> pick one small thing you actually want to exist and build it, looking things up as you get stuck. That's not a lesser way to learn — it's how every professional keeps learning. You have the foundation now. Go make something.</p>
      <div class="actions" style="justify-content:center; margin-top:20px;">
        <button class="run" onclick="loadLesson(0)">Review from start</button>
      </div>
    </div>`;
  completed.add(course.length - 1);
  renderSidebar();
}

// ---- HELPERS ----
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attachTab(){
  const ta = document.getElementById('editor');
  if(!ta) return;
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){ e.preventDefault();
      const s=this.selectionStart, en=this.selectionEnd;
      this.value=this.value.slice(0,s)+'  '+this.value.slice(en);
      this.selectionStart=this.selectionEnd=s+2;
    }
  });
}

loadLesson(0);
updateStats();
</script>
